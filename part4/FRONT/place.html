<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details - HBNB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" type="image/x-icon">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="HBNB Logo">
                <span>HBNB</span>
            </a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
            <div class="place-info">
                <!-- Place details will be populated dynamically -->
            </div>
        </section>

        <section id="reviews" class="reviews-section">
            <h2>Reviews</h2>
            <div id="reviews-container">
                <!-- Reviews will be populated dynamically -->
            </div>
            <a href="add_review.html" id="add-review-btn" class="add-review-btn" style="display: none;">Add Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
