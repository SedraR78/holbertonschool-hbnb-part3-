<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Of Places - HBNB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" type="image/x-icon">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="HBNB Logo">
                <span>HBNB</span>
            </a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h1>Welcome to HBNB</h1>
            <p>Discover amazing places around the world</p>
        </section>

        <section id="filter">
            <label for="price-filter">Filter by Max Price:</label>
            <select id="price-filter">
                <option value="">All Prices</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
                <option value="150">$150</option>
                <option value="200">$200</option>
                <option value="250">$250</option>
            </select>
        </section>

        <section id="places-list" class="places-container">
            <!-- List of places will be populated dynamically -->
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
